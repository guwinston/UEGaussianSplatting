; Mobile profiles for the Gaussian splat rendering paths.

[Android DeviceProfile]
DeviceType=Android
BaseProfileName=
+CVars=r.RayTracing=0
+CVars=r.Lumen.DiffuseIndirect.Allow=0
+CVars=r.Lumen.Reflections.Allow=0
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.GenerateMeshDistanceFields=0
+CVars=r.GaussianSplat.EnableHigherOrderSH=0
+CVars=r.GaussianSplat.RasterMode=0
+CVars=r.GaussianSplat.CullMode=2
+CVars=r.GaussianSplat.EnableAntialiasing=0
+CVars=r.GaussianSplat.OpacityAwareBounds=1

; UE 5.5 disables Vulkan SM5 by default on the Adreno 6xx profile even when
; runtime capability detection succeeds. This project only cooks the SM5 path.
[Android_Adreno6xx_Vulkan DeviceProfile]
+CVars=r.Android.DisableVulkanSM5Support=0
+CVars=r.Android.SupportsTimestampQueries=1
+CVars=r.GPUStatsEnabled=1
+CVars=r.GPUStatsChildTimesIncluded=1
+CVars=r.GaussianSplat.ForceSortEveryFrame=0

[IOS DeviceProfile]
DeviceType=IOS
BaseProfileName=
+CVars=r.RayTracing=0
+CVars=r.Lumen.DiffuseIndirect.Allow=0
+CVars=r.Lumen.Reflections.Allow=0
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.GenerateMeshDistanceFields=0
+CVars=r.GaussianSplat.EnableHigherOrderSH=0
+CVars=r.GaussianSplat.RasterMode=0
+CVars=r.GaussianSplat.CullMode=2
+CVars=r.GaussianSplat.EnableAntialiasing=0
