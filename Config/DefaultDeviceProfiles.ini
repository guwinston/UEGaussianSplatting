; Mobile profiles for the Gaussian splat rendering paths.

[Android DeviceProfile]
DeviceType=Android
BaseProfileName=
+CVars=r.RayTracing=0
+CVars=r.Lumen.DiffuseIndirect.Allow=0
+CVars=r.Lumen.Reflections.Allow=0
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.GenerateMeshDistanceFields=0
+CVars=r.GaussianSplat.EnableHigherOrderSH=0
+CVars=r.GaussianSplat.RasterMode=0
+CVars=r.GaussianSplat.CullMode=2
+CVars=r.GaussianSplat.EnableAntialiasing=0
+CVars=r.GaussianSplat.OpacityAwareBounds=1
; Three high-byte radix passes reduce DeviceRadix work by 25% while retaining
; the significant exponent/mantissa bits used by the sortable float depth key.
+CVars=r.GaussianSplat.DeviceRadixPasses=3
+CVars=r.GaussianSplat.DeviceRadixWriteFinalKeys=0

; Enable RHI GPU timestamp queries for stat gpu on all Android devices.
+CVars=r.Android.SupportsTimestampQueries=1
+CVars=r.GPUStatsEnabled=1
+CVars=r.GPUStatsChildTimesIncluded=1
; This project only cooks the Vulkan SM5 path (no ES3.1 fallback). The engine
; disables Vulkan SM5 by default in the base [Android DeviceProfile]; overriding
; it here ensures Adreno 6xx/7xx/8xx, Mali and all other Vulkan-capable devices
; can render Gaussian splats. Overrides per-device (e.g. Adreno6xx) are no longer
; needed since this base setting propagates down the inheritance chain.
+CVars=r.Android.DisableVulkanSM5Support=0
+CVars=r.GaussianSplat.ForceSortEveryFrame=0

[IOS DeviceProfile]
DeviceType=IOS
BaseProfileName=
+CVars=r.RayTracing=0
+CVars=r.Lumen.DiffuseIndirect.Allow=0
+CVars=r.Lumen.Reflections.Allow=0
+CVars=r.Shadow.Virtual.Enable=0
+CVars=r.GenerateMeshDistanceFields=0
+CVars=r.GaussianSplat.EnableHigherOrderSH=0
+CVars=r.GaussianSplat.RasterMode=0
+CVars=r.GaussianSplat.CullMode=2
+CVars=r.GaussianSplat.EnableAntialiasing=0
